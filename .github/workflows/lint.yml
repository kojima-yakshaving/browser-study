name: lint

on:
  pull_request:
  workflow_dispatch:

jobs:
  pydoclint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check docstrings match signatures
        run: uv run pydoclint gorushi
