[project]
name = "browser-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-watch",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["E501"]

[dependency-groups]
dev = [
    "fastapi>=0.120.0",
    "pyrefly>=1.2.0",
    "pytest>=8.4.2",
    "pytest-watch>=4.2.0",
    "ruff>=0.14.2",
    "ty>=0.0.1a24",
    "uvicorn>=0.38.0",
]

[tool.pyrefly]
project-includes = [
    "gorushi/*.py",
    "gorushi/**/*.py",
    "tests/*.py",
    "tests/**/*.py",
    "demo/**/*.py",
    "main.py",
    "server.py",
]
search-path = ["."]
python-interpreter = ".venv/bin/python"
