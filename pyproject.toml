[project]
name = "browser-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-watch",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["E501", "D100", "D101", "D102", "D103", "D104", "D106"]
# D105 (magic methods) and D107 (__init__) are self-evident; skip them.

[tool.ruff.lint.per-file-ignores]
# Docstring enforcement only applies to the gorushi package for now.
"main.py" = ["D100", "D101", "D102", "D103", "D104", "D106"]
"server.py" = ["D100", "D101", "D102", "D103", "D104", "D106"]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D106"]
"demo/**" = ["D100", "D101", "D102", "D103", "D104", "D106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false

[dependency-groups]
dev = [
    "fastapi>=0.120.0",
    "pre-commit>=4.6.2",
    "pydoclint>=0.9.1",
    "pyrefly>=1.2.0",
    "pytest>=8.4.2",
    "pytest-watch>=4.2.0",
    "ruff>=0.14.2",
    "ty>=0.0.1a24",
    "uvicorn>=0.38.0",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.13.6",
]

[tool.pyrefly]
project-includes = [
    "gorushi/*.py",
    "gorushi/**/*.py",
    "tests/*.py",
    "tests/**/*.py",
    "demo/**/*.py",
    "main.py",
    "server.py",
]
search-path = ["."]
python-interpreter = ".venv/bin/python"
